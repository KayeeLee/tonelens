<html lang="zh-CN">
<head>

<title>ToneLens — Sound-first Effects Learning Tool</title>
<style>

header{position:sticky;top:0;z-index:30;border-bottom:1px solid rgba(18,19,15,.18);background:rgba(241,241,237,.9);backdrop-filter:blur(14px)}.head{height:66px;display:flex;align-items:center;gap:24px}.brand{border:0;background:none;font-size:19px;font-weight:900;letter-spacing:-.04em;cursor:pointer;display:flex;align-items:center;gap:10px}.mark{width:29px;height:29px;border:1.5px solid;border-radius:50%;position:relative}.mark:before,.mark:after{content:"";position:absolute;left:6px;right:6px;height:1.5px;background:var(--ink)}.mark:before{top:9px;transform:rotate(12deg)}.mark:after{bottom:8px;transform:rotate(-12deg)}nav{display:flex;margin-left:auto;gap:3px}.nav,.lang{border:0;background:transparent;border-radius:6px;padding:8px 11px;cursor:pointer;font-size:13px}.nav:hover,.nav.active,.lang:hover{background:rgba(18,19,15,.07)}.langs{border:1px solid #a9aaa3;border-radius:7px;padding:2px;display:flex}.lang{padding:5px 7px;font:700 10px Consolas,monospace}.lang.active{background:var(--ink);color:#fff}
.page{display:none}.page.active{display:block}.eyebrow{display:flex;align-items:center;gap:10px;color:var(--muted);font:700 10px Consolas,monospace;letter-spacing:.12em;text-transform:uppercase}.eyebrow:before{content:"";width:26px;height:1px;background:currentColor}.hero{min-height:calc(100vh - 66px);display:grid;grid-template-columns:1.03fr .97fr;gap:55px;align-items:center;padding:70px 0}.hero h1{font-size:clamp(52px,6vw,90px);line-height:.95;letter-spacing:-.07em;margin:18px 0 24px}.hero-copy{font-size:16px;color:#41433e;max-width:690px}.hero-copy p{margin:0 0 12px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin:29px 0 20px}.btn{border:1px solid var(--ink);background:transparent;border-radius:7px;padding:12px 17px;font-weight:800;cursor:pointer}.btn.primary{background:var(--ink);color:white}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{border:1px solid #aaa;padding:6px 9px;border-radius:999px;font-size:11px;background:rgba(250,250,247,.6)}

;letter-spacing:-.03em;margin:30px 0 8px}.canonical{font:700 .55em Consolas,monospace;color:var(--muted);display:block;margin-top:3px}.card p{font-size:12px;color:var(--muted)}

.chain-wrap{padding:50px 0 100px}.chain{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.chain button{min-height:155px;border:1px solid var(--ink);background:var(--paper);border-radius:8px;padding:15px;text-align:left;position:relative;cursor:pointer;box-shadow:inset 0 -5px var(--color,transparent)}.chain button:after{content:"→";position:absolute;right:-14px;top:47%;z-index:2}.chain button:nth-child(5n):after,.chain button:last-child:after{display:none}.chain small{font:700 9px Consolas,monospace;color:var(--muted)}.chain h3{font-size:18px;margin:35px 0 7px}.chain p{font-size:11px;color:var(--muted)}.chain-detail{display:grid;grid-template-columns:230px 1fr;gap:30px;border:1px solid var(--ink);border-radius:8px;background:var(--paper);padding:21px;margin-top:14px}.chain-detail h3{font-size:28px;margin:0}.guide{display:grid;grid-template-columns:280px 1fr;gap:13px;padding:40px 0 100px}.issues{display:grid;gap:7px}.issue{border:1px solid #aaa;background:var(--paper);border-radius:6px;padding:12px;text-align:left;cursor:pointer}.issue.active{background:var(--ink);color:#fff;border-color:var(--ink)}.guide-panel{border:1px solid var(--ink);border-radius:9px;background:var(--paper);overflow:hidden}.guide-head{padding:26px;border-bottom:1px solid var(--ink)}.guide-head h2{font-size:40px;letter-spacing:-.05em;margin:7px 0}.step{display:grid;grid-template-columns:55px 1fr;gap:13px;padding:20px 25px;border-bottom:1px solid var(--line)}.step:last-child{border-bottom:0}.num{width:40px;height:40px;border:1px solid;border-radius:50%;display:grid;place-items:center;font:700 10px Consolas,monospace}.step h3{margin:0 0 5px;font-size:17px}.step p{margin:0;color:var(--muted);font-size:13px}footer{padding:32px 0 45px}.foot{display:flex;justify-content:space-between}.foot strong{font-size:27px;letter-spacing:-.04em}
@media(max-width:1000px){.hero{grid-template-columns:1fr}.four{grid-template-columns:1fr 1fr}.benefit:nth-child(2){border-right:0}.cards{grid-template-columns:1fr 1fr}.detail-top{grid-template-columns:1fr}.detail-copy{border-right:0;border-bottom:1px solid}.chain{grid-template-columns:repeat(3,1fr)}.chain button:nth-child(5n):after{display:block}.chain button:nth-child(3n):after{display:none}}
@media(max-width:720px){.container{width:min(345px,calc(100% - 30px))}nav{display:none}.head{gap:10px}.langs{margin-left:auto}.hero{padding:52px 0 65px;gap:34px}.hero h1{font-size:51px}.hero-tool{height:440px}.tool-canvas{height:270px}.tool-tabs{overflow-x:auto;grid-template-columns:repeat(5,95px)}.tool-tab{min-width:95px}.section{padding:75px 0}.section-head{grid-template-columns:1fr;gap:18px}.section h2{font-size:45px}.three,.four{grid-template-columns:1fr;border-bottom:0}.panel,.benefit{border-right:0;border-bottom:1px solid;min-height:225px}.starters{grid-template-columns:1fr}.starter{min-height:270px}.page-hero{padding-top:50px}.page-hero h1{font-size:54px}.library{grid-template-columns:1fr}.sidebar{border-right:0;border-bottom:1px solid;padding:20px 0}.family-list{display:flex;overflow-x:auto}.family-btn{min-width:170px}.divider{display:none}.library-main{padding:28px 0 70px}.family-head{grid-template-columns:1fr}.hear{border-left:0;border-top:1px solid #aaa;padding:15px 0 0}.family-head h2{font-size:40px}.cards{grid-template-columns:1fr}.detail-copy h2{font-size:44px}.detail-copy,.lab{padding:21px}.detail-grid{grid-template-columns:1fr}.detail-sec{border-right:0}.chain{grid-template-columns:1fr}.chain button:after,.chain button:nth-child(3n):after,.chain button:nth-child(5n):after{content:"↓";display:block;right:auto;left:49%;top:auto;bottom:-20px}.chain button:last-child:after{display:none}.chain-detail{grid-template-columns:1fr}.guide{grid-template-columns:1fr}.issues{display:flex;overflow-x:auto}.issue{min-width:170px}.foot{display:block}.foot strong{display:block;margin-bottom:18px}}

.creator-strip{padding:0 0 24px}
.creator-card{
  display:grid;
  grid-template-columns:minmax(0,1.08fr) minmax(480px,.92fr);
  align-items:center;
  gap:54px;
  padding:32px 0 34px;
  border-top:1px solid var(--ink)
}
.creator-left{min-width:0}
.creator-profile{display:flex;align-items:center;gap:18px}
.creator-avatar{
  width:72px;height:72px;border-radius:50%;overflow:hidden;flex-shrink:0;
  border:2px solid rgba(18,19,15,.08);box-shadow:0 3px 16px rgba(18,19,15,.06)
}
.creator-avatar img{width:100%;height:100%;object-fit:cover;object-position:center 34%;display:block}
.creator-kicker{
  font:700 10px/1.2 Consolas,monospace;letter-spacing:.18em;text-transform:uppercase;
  color:#7f8491;margin:0 0 8px
}
.creator-kicker .dot{color:var(--accent);font-size:12px;margin-right:6px}
.creator-title{font-size:36px;line-height:1.04;letter-spacing:-.05em;margin:0 0 7px}
.creator-title .accent{color:var(--accent)}
.creator-desc{font-size:16px;color:#41443e;margin:0}
.creator-links{display:flex;gap:24px;flex-wrap:wrap;margin-left:90px;margin-top:16px}
.creator-link{border:0;background:none;padding:0;font-size:14px;color:#7b8090;cursor:pointer}
.creator-link:hover{color:var(--ink)}
.creator-right{
  min-width:0;display:grid;
  grid-template-columns:82px minmax(0,1fr) auto;
  grid-template-areas:"badge label button" "badge email button" "badge help button";
  column-gap:18px;row-gap:3px;align-items:center;text-align:left;
  padding-left:38px;border-left:1px solid var(--line)
}
.contact-badge{
  grid-area:badge;width:82px;height:82px;border:1px solid var(--line);background:var(--paper);
  border-radius:11px;display:grid;place-items:center;box-shadow:0 8px 24px rgba(18,19,15,.045)
}
.mail-mark{width:42px;height:42px;border-radius:13px;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:22px}
.contact-label{
  grid-area:label;margin:0;font:700 10px/1.2 Consolas,monospace;letter-spacing:.18em;
  text-transform:uppercase;color:#7f8491
}
.contact-email{
  grid-area:email;display:block;margin:0;font-size:17px;font-weight:850;line-height:1.25;
  letter-spacing:-.025em;color:var(--ink);white-space:nowrap;text-decoration:none
}
.contact-email:hover{text-decoration:underline;text-underline-offset:4px}
.contact-help{grid-area:help;margin:2px 0 0;color:var(--muted);font-size:12px;line-height:1.45;max-width:360px}
.contact-btn{
  grid-area:button;display:inline-flex;align-items:center;justify-content:center;min-height:40px;
  padding:0 15px;margin:0;border:1px solid var(--ink);border-radius:999px;background:transparent;
  font-size:13px;font-weight:800;white-space:nowrap;text-decoration:none;color:var(--ink)
}
.contact-btn:hover{background:var(--ink);color:#fff}
.foot{border-top:1px solid var(--ink)}
@media(max-width:980px){
  .creator-card{grid-template-columns:1fr;gap:25px;padding:28px 0 30px}
  .creator-right{grid-template-columns:72px minmax(0,1fr) auto;padding:22px 0 0;border-left:0;border-top:1px solid var(--line)}
  .contact-badge{width:72px;height:72px}.mail-mark{width:38px;height:38px}
}
@media(max-width:760px){
  .creator-strip{padding-bottom:16px}.creator-card{gap:22px;padding:24px 0 26px}
  .creator-profile{align-items:flex-start;gap:14px}.creator-avatar{width:62px;height:62px}
  .creator-title{font-size:30px}.creator-desc{font-size:14px;line-height:1.55}
  .creator-links{margin-left:76px;margin-top:14px;gap:18px}
  .creator-right{
    grid-template-columns:58px minmax(0,1fr);
    grid-template-areas:"badge label" "badge email" "help help" "button button";
    column-gap:14px;row-gap:4px;padding-top:20px
  }
  .contact-badge{width:58px;height:58px}.mail-mark{width:34px;height:34px;border-radius:10px;font-size:18px}
  .contact-email{font-size:15px;white-space:normal;overflow-wrap:anywhere}
  .contact-help{margin-top:8px;max-width:none}.contact-btn{justify-self:start;margin-top:8px;min-height:38px}
}

</style>
</head>
<body>
<header><div class="container head"><button class="brand go" data-page="home"><span class="mark"></span>ToneLens</button><nav><button class="nav go active" data-page="home" data-key="navHome"></button><button class="nav go" data-page="effects" data-key="navEffects"></button><button class="nav go" data-page="map" data-key="navMap"></button><button class="nav go" data-page="guide" data-key="navGuide"></button></nav><div class="langs"><button class="lang" data-lang="en">EN</button><button class="lang active" data-lang="zh">中</button><button class="lang" data-lang="ja">日</button></div></div></header>
<main>
<section class="page active" id="home"><div class="container hero"><div><div class="eyebrow" data-key="heroEye"></div><h1 data-key="heroTitle"></h1><div class="hero-copy" data-html="heroBody"></div><div class="actions"><button class="btn primary" id="choose" data-key="choose"></button><button class="btn go" data-page="map" data-key="seeMap"></button></div><div class="chips"><span class="chip" data-key="proof1"></span><span class="chip" data-key="proof2"></span><span class="chip" data-key="proof3"></span></div></div><div class="hero-tool"><div class="tool-head"><span>TONE EXPERIMENT 001</span><span data-key="interactive"></span></div><div class="tool-canvas"><div class="tool-line"></div><div class="sound" id="sound" data-mode="clean"></div></div><div class="tool-tabs" id="toolTabs"></div><div class="tool-caption" id="toolCaption"></div></div></div>

const copy={zh:{navHome:"首页",navEffects:"效果器",navMap:"声音路径",navGuide:"音色排查",heroEye:"由新手制作，也为新手而做",heroTitle:"不再只是复制参数，开始理解自己的音色。",heroBody:`<p>刚开始学习电吉他时，我一直使用网上别人分享的音色，却不太清楚每一个效果器到底改变了什么。</p><p>综合效果器中还有大量 AMP、CAB、MOD 等模块，以及用不同代号表示的经典设备。面对相似的名称、型号和参数，我常常不知道它们代表什么、应该怎样选择。</p><p>ToneLens 正是从这些困惑出发，把效果器分类、声音路径和听感变化整理成一个可以查询、观察和逐步尝试的互动学习工具。</p>`,choose:"选择我的起始点 ↓",seeMap:"看看声音如何形成",proof1:"看懂效果器作用",proof2:"识别设备与模块代号",proof3:"找到调整方向",interactive:"可互动",whyEye:"为什么会有 ToneLens",whyTitle:"设备写出了参数，却没有告诉你应该听什么。",whyLead:"新手知道旋钮可以转动，却不一定知道声音在哪里变化，也不知道相似效果为什么听起来不同。",p1t:"看不懂名称",p1b:"Feedback、IR、MOD 与设备代号同时出现，很难知道它们之间的关系。",p2t:"听不清差别",p2b:"Chorus、Phaser 和 Flanger 都属于调制类，但运动方式并不一样。",p3t:"照抄也调不对",p3b:"音色来自 Guitar、Amp、Cab、Effects 与 Output 的共同作用，而不是单独一个数字。",getEye:"通过 ToneLens，你能得到什么",getTitle:"从“会转旋钮”，变成“知道自己在改变什么”。",getLead:"专业分类帮助你看懂真实设备；听觉描述帮助你记忆；Signal Chain 负责解释位置。",b1t:"看懂声音链",b1b:"理解 Effects 与 Amp、Cab、Output 的位置关系。",b2t:"从听感记住效果",b2b:"先记住温暖、粗糙、漂浮、重复与空间，再补技术原理。",b3t:"区分相似效果",b3b:"比较 Overdrive 与 Distortion、Tremolo 与 Vibrato、Delay 与 Reverb。",b4t:"找到调整方向",b4b:"从声音太糊、太刺耳或 Delay 太乱开始逐步排查。",startEye:"选择起始点",startTitle:"你现在想先弄懂什么？",startLead:"不需要从第一课开始，选择最接近当前问题的入口。",s1t:"我完全不懂音色",s1b:"先看声音怎样经过 Guitar、Amp、Effects 和 Output。",s2t:"我想认识效果器分类",s2b:"从 Dynamics、Distortion、Modulation、Delay 和 Reverb 等标准分类开始。",s3t:"我看到了陌生名称",s3b:"查询 Effect、Control、设备代号或听感词。",s4t:"我的声音不太对",s4b:"从声音太糊、太刺耳、噪声或和弦不清楚开始。",effectsEye:"标准效果器分类",effectsTitle:"先听见它的性格，再记住它属于哪一类。",effectsLead:"Effect Library 使用行业常见分类，但每个效果的第一层信息始终是：打开以后，你实际会听到什么。",usuallyHear:"通常会听见",mapEye:"常见信号位置",mapTitle:"这是一条常见的声音路径，不是效果器分类。",mapLead:"分类告诉你“它是什么”；Signal Chain 告诉你“它通常在哪里”。顺序可以改变，不同顺序也会产生不同结果。",guideEye:"从听感开始排查",guideTitle:"先描述你听见的问题，再决定该动哪个旋钮。",guideLead:"一次只改变一个变量，没有改善时恢复原设置。",guided:"逐步检查",search:"搜索：过载、Chorus、Feedback、声音太糊…",what:"01 / 你会听到什么",styles:"02 / 常见音乐方向",family:"03 / 效果器分类",changes:"04 / 它改变了什么",controls:"05 / 核心参数",confuse:"06 / 容易混淆",position:"07 / 常见位置",experiment:"08 / 入门实验",lab:"Visual Tone Lab",noResult:"没有找到相符的效果。"},
en:{navHome:"Home",navEffects:"Effects",navMap:"Sound Map",navGuide:"Tone Guide",heroEye:"Made by a beginner, for beginners",heroTitle:"Stop copying settings. Start understanding your tone.",heroBody:`<p>When I started electric guitar, I relied on tone settings shared online without really understanding what each effect changed.</p><p>Multi-effects units also contain AMP, CAB, MOD and coded names for classic gear. Faced with similar names, models and controls, I often did not know what they meant or which one to choose.</p><p>ToneLens grew from those questions: a visual learning tool for effect families, signal paths and audible changes.</p>`,choose:"Choose my starting point ↓",seeMap:"See how tone is formed",proof1:"Understand effects",proof2:"Decode gear names",proof3:"Know what to adjust",interactive:"INTERACTIVE",whyEye:"Why ToneLens",whyTitle:"Gear shows parameter names, but rarely tells you what to listen for.",whyLead:"Beginners can turn controls without knowing where the change happens or why similar effects feel different.",p1t:"Names are unclear",p1b:"Feedback, IR, MOD and coded gear names appear together without showing their relationship.",p2t:"Differences are hard to hear",p2b:"Chorus, Phaser and Flanger are all modulation, but they move sound differently.",p3t:"Copied settings do not translate",p3b:"Tone comes from Guitar, Amp, Cab, Effects and Output together—not one number.",getEye:"What You Get",getTitle:"Move from turning knobs to knowing what you are changing.",getLead:"Professional families help you read gear; listening words build memory; Signal Chain explains position.",b1t:"See the signal path",b1b:"Understand where Effects sit relative to Amp, Cab and Output.",b2t:"Remember by sound",b2b:"Start with warm, rough, floating, repeating and spacious before technical theory.",b3t:"Separate similar effects",b3b:"Compare Overdrive vs Distortion, Tremolo vs Vibrato, Delay vs Reverb.",b4t:"Know where to adjust",b4b:"Troubleshoot muddy, harsh, noisy or messy tones step by step.",startEye:"Choose Your Starting Point",startTitle:"What would you like to understand first?",startLead:"You do not need to begin with lesson one. Pick the closest entry.",s1t:"I know nothing about tone",s1b:"Follow the signal through Guitar, Amp, Effects and Output.",s2t:"I want to learn effect families",s2b:"Start with standard categories such as Dynamics, Distortion, Modulation, Delay and Reverb.",s3t:"I found an unfamiliar name",s3b:"Look up an Effect, Control, coded gear name or listening term.",s4t:"My tone sounds wrong",s4b:"Start with muddy, harsh, noisy or unclear chords.",effectsEye:"Standard Effect Families",effectsTitle:"Hear its character first. Then learn its family.",effectsLead:"The library follows familiar industry categories, while every effect begins with the audible result.",usuallyHear:"What You Usually Hear",mapEye:"Common Signal Position",mapTitle:"This is a common signal path, not a list of effect families.",mapLead:"Families explain what something is; Signal Chain explains where it is commonly placed. Order can change.",guideEye:"Fix by Listening",guideTitle:"Describe what you hear before deciding which control to move.",guideLead:"Change one variable at a time and restore it when there is no improvement.",guided:"Guided Check",search:"Search Overdrive, Chorus, Feedback, Muddy…",what:"01 / What You Will Hear",styles:"02 / Common Music Directions",family:"03 / Effect Family",changes:"04 / What It Changes",controls:"05 / Core Controls",confuse:"06 / Do Not Confuse With",position:"07 / Common Position",experiment:"08 / Beginner Experiment",lab:"Visual Tone Lab",noResult:"No matching effect found."},
ja:{navHome:"ホーム",navEffects:"エフェクト",navMap:"サウンドマップ",navGuide:"音作りガイド",heroEye:"初心者が、初心者のために作りました",heroTitle:"設定をコピーするだけでなく、自分の音を理解する。",heroBody:`<p>エレキギターを始めた頃、ネットで共有された音色設定を使っていましたが、各エフェクトが何を変えているのかはよく分かっていませんでした。</p><p>マルチエフェクターには AMP、CAB、MOD など多くのモジュールがあり、名機を示すコード名もあります。似た名称やモデルを前に意味や選び方が分からないことがよくありました。</p><p>ToneLens はその疑問から生まれた、エフェクト分類、Signal Chain、聴こえ方の変化を視覚的に学ぶツールです。</p>`,choose:"スタート地点を選ぶ ↓",seeMap:"音が作られる流れを見る",proof1:"エフェクトの役割",proof2:"機材名・コード名",proof3:"調整の方向",interactive:"操作できます",whyEye:"ToneLens が生まれた理由",whyTitle:"機材にはパラメーター名があっても、何を聴けばよいかは書かれていません。",whyLead:"ノブを回せても、どこが変化したのか、似たエフェクトがなぜ違うのかは分かりにくいものです。",p1t:"名称が分からない",p1b:"Feedback、IR、MOD、機材コード名の関係が分かりにくい。",p2t:"違いを聴き分けにくい",p2b:"Chorus、Phaser、Flanger はすべて Modulation ですが動き方は異なります。",p3t:"設定を写しても合わない",p3b:"音色は Guitar、Amp、Cab、Effects、Output の組み合わせで決まります。",getEye:"ToneLens で得られること",getTitle:"「ノブを回せる」から「何を変えているか分かる」へ。",getLead:"正しい分類で実機を理解し、聴感で記憶し、Signal Chain で位置を学びます。",b1t:"Signal Chain を理解",b1b:"Effects と Amp、Cab、Output の位置関係を理解します。",b2t:"聴感から覚える",b2b:"温かい、粗い、漂う、繰り返す、広がる感覚から始めます。",b3t:"似た効果を区別",b3b:"Overdrive と Distortion、Tremolo と Vibrato、Delay と Reverb を比較します。",b4t:"調整の方向が分かる",b4b:"音がこもる、耳に痛い、Delay が散らかる問題から確認します。",startEye:"スタート地点",startTitle:"今、何から知りたいですか？",startLead:"最初から順番に学ぶ必要はありません。今の疑問に近い入口を選びます。",s1t:"音作りがまったく分からない",s1b:"Guitar から Amp、Effects、Output までの流れを見ます。",s2t:"エフェクト分類を知りたい",s2b:"Dynamics、Distortion、Modulation、Delay、Reverb などから学びます。",s3t:"知らない名称を見つけた",s3b:"Effect、Control、機材コード名、聴感用語を検索します。",s4t:"音がうまく決まらない",s4b:"音がこもる、耳に痛い、ノイズ、コードが潰れる問題から始めます。",effectsEye:"標準エフェクト分類",effectsTitle:"まず音のキャラクターを聴き、その後で分類を覚える。",effectsLead:"一般的な分類を使いながら、各エフェクトは実際にどう聴こえるかから説明します。",usuallyHear:"よく聴こえる特徴",mapEye:"一般的な配置",mapTitle:"これは一般的な Signal Chain であり、エフェクト分類ではありません。",mapLead:"分類は何であるか、Signal Chain はどこに置くかを説明します。",guideEye:"聴感から直す",guideTitle:"聴こえた問題を言葉にしてから、動かすノブを決める。",guideLead:"一度に1つだけ変え、改善しなければ元に戻します。",guided:"順番に確認",search:"検索：オーバードライブ、コーラス、Feedback、音がこもる…",what:"01 / どう聴こえる？",styles:"02 / よく使われる方向",family:"03 / エフェクト分類",changes:"04 / 何を変える？",controls:"05 / 主なパラメーター",confuse:"06 / 間違えやすい効果",position:"07 / 一般的な位置",experiment:"08 / 初心者向け実験",lab:"Visual Tone Lab",noResult:"一致するエフェクトがありません。"}};

"Compressor":{f:"dynamics",v:"dynamics",n:{zh:"压缩器",en:"Compressor",ja:"コンプレッサー"},t:{zh:"压低过大的峰值，让弱音相对更清楚，声音更稳定。",en:"Reduces loud peaks so softer notes become clearer and level feels steadier.",ja:"大きなピークを抑え、小さい音を相対的に明瞭にします。"},hear:{zh:["稳定","弱音清楚","起音可能变软","延音更明显"],en:["Even","Soft notes clearer","Softer attack","More sustain"],ja:["安定","弱音が明瞭","立ち上がりが丸い","音の伸び"]},styles:["Funk Clean","Country","Clean Arpeggio"],change:{zh:"改变强弱差、起音形状和尾音的可听程度。",en:"Changes dynamic range, attack shape and audible tail.",ja:"強弱差、立ち上がり、余韻を変えます。"},controls:[["Threshold",{zh:"越低，越多信号被压缩。",en:"Lower values compress more signal.",ja:"低いほど多くの信号を圧縮します。"}],["Attack",{zh:"越快，拨弦起音越容易被压住。",en:"Faster settings catch more pick attack.",ja:"速いほどピッキングを強く抑えます。"}],["Release",{zh:"决定压缩恢复速度。",en:"Controls how quickly compression lets go.",ja:"圧縮が戻る速さを決めます。"}]],compare:[["Limiter",{zh:"Limiter 更强硬地阻止峰值超过上限。",en:"A limiter more firmly stops peaks crossing a ceiling.",ja:"Limiter はピークをより強く抑えます。"}]],position:{zh:"通常位于声音链前段、Drive / Amp 之前。",en:"Usually early in the chain before Drive / Amp.",ja:"通常はチェイン前段、Drive / Amp の前です。"},experiment:{zh:"交替轻弹与重弹同一个音，比较强弱差与拨弦轮廓，不要只比较音量。",en:"Alternate soft and hard picking; compare dynamics and attack, not just loudness.",ja:"同じ音を弱く／強く弾き、強弱差と立ち上がりを比較します。"}},
"Noise Gate":{f:"dynamics",v:"dynamics",n:{zh:"噪声门",en:"Noise Gate",ja:"ノイズ・ゲート"},t:{zh:"当信号低于阈值时降低声音，让停顿更干净。",en:"Reduces signal below a threshold so pauses become cleaner.",ja:"信号がしきい値を下回ると音量を下げ、無音部をきれいにします。"},hear:{zh:["停顿干净","底噪减少","尾音可能被切断"],en:["Clean stops","Less noise","Tail may be cut"],ja:["無音部がきれい","ノイズ低減","余韻が切れる場合"]},styles:["High Gain Rhythm","Metal","Live Rig"],change:{zh:"决定低电平声音是否继续通过。",en:"Controls whether low-level sound continues to pass.",ja:"小さい信号を通すかどうかを決めます。"},controls:[["Threshold",{zh:"越高越容易关闭，也越可能切断轻弹和延音。",en:"Higher values close sooner and may cut soft notes.",ja:"高いほど早く閉じ、弱い音を切りやすくなります。"}],["Release",{zh:"决定门关闭得多快。",en:"Controls closing speed.",ja:"閉じる速さを決めます。"}]],compare:[["Noise Suppressor",{zh:"通常更平滑地降低噪声。",en:"Often reduces noise more gradually.",ja:"より滑らかにノイズを抑える場合があります。"}]],position:{zh:"通常靠近输入端，也可能放在高增益模块之后。",en:"Usually near the input, sometimes after high gain.",ja:"通常は入力付近、またはハイゲイン段の後です。"},experiment:{zh:"逐渐提高 Threshold，找到噪声刚好消失但延音仍自然的位置。",en:"Raise Threshold until noise just disappears while sustain remains natural.",ja:"ノイズが消え、余韻が自然に残る位置を探します。"}},
"Boost":{f:"drive",v:"drive",n:{zh:"激励／提升",en:"Boost",ja:"ブースター"},t:{zh:"提高进入 Amp 的信号，让声音更响、更集中，或推动 Amp 产生更多失真。",en:"Raises the signal into the amp for more level, focus or amp distortion.",ja:"Amp へ入る信号を上げ、音量、集中感、歪みを増やします。"},hear:{zh:["更响","攻击突出","推动 Amp","可能更紧"],en:["Louder","More attack","Pushes amp","Tighter"],ja:["音量アップ","アタック","Amp をプッシュ","タイト"]},styles:["Rock Lead","Metal Boost","Solo"],change:{zh:"主要改变进入下一个模块的信号电平，有些 Boost 也会调整频率。",en:"Primarily changes level into the next stage; some boosts also shape frequency.",ja:"主に次段へ送るレベルを変え、一部は周波数も整えます。"},controls:[["Level",{zh:"决定推动下一个模块的程度。",en:"Controls how hard the next stage is driven.",ja:"次段をどれだけ強く押すかを決めます。"}],["Tone",{zh:"调整明暗或中频倾向。",en:"Shapes brightness or mids.",ja:"明るさや中域を調整します。"}]],compare:[["Overdrive",{zh:"Boost 可以几乎不产生自身失真；Overdrive 通常带有削波。",en:"Boost may add little clipping; Overdrive normally clips.",ja:"Boost は歪みを加えない場合があり、Overdrive は通常クリップします。"}]],position:{zh:"通常位于 Amp 之前。",en:"Usually before the amp.",ja:"通常は Amp の前です。"},experiment:{zh:"保持 Amp Gain 不变，只提高 Boost Level，听拨弦与低频紧实度的变化。",en:"Keep amp gain fixed and raise Boost Level; listen to attack and tightness.",ja:"Amp Gain を固定し Boost Level だけ上げます。"}},
"Overdrive":{f:"drive",v:"drive",n:{zh:"过载",en:"Overdrive",ja:"オーバードライブ"},t:{zh:"产生较自然的轻度失真、压缩和谐波，通常仍保留明显演奏动态。",en:"Adds natural light distortion, compression and harmonics while often preserving dynamics.",ja:"自然な軽い歪み、圧縮、倍音を加え、演奏の強弱を比較的残します。"},hear:{zh:["温暖","颗粒","轻微压缩","保留动态","推动感"],en:["Warm","Grainy","Light compression","Dynamic","Pushing"],ja:["温かい","粒立ち","軽い圧縮","ダイナミック","押し出し"]},styles:["Blues","Classic Rock","J-Rock","Rock Lead"],change:{zh:"削波并重新塑造进入 Amp 的频率。既可自己产生失真，也可用低 Drive、高 Level 推动 Amp。",en:"Clips and reshapes the signal into the amp. It can provide distortion or push an amp with low Drive/high Level.",ja:"信号をクリップし Amp へ入る周波数を整えます。Drive 低／Level 高で Amp をプッシュできます。"},controls:[["Drive",{zh:"决定效果器自身产生多少失真与压缩。",en:"Controls pedal clipping and compression.",ja:"ペダル自身の歪みと圧縮量を決めます。"}],["Tone",{zh:"调整明暗与中高频轮廓。",en:"Shapes brightness and upper mids.",ja:"明るさと中高域を調整します。"}],["Level",{zh:"决定送进 Amp 的信号有多大。",en:"Controls how strongly the amp is driven.",ja:"Amp へ送る信号量を決めます。"}]],compare:[["Distortion",{zh:"Distortion 通常更厚、更稳定、压缩更多；Overdrive 更随拨弦力度变化。",en:"Distortion is usually thicker and more consistently saturated; Overdrive reacts more to picking.",ja:"Distortion は厚く安定し、Overdrive はピッキングへの反応が残りやすい傾向です。"}],["Amp Overdrive",{zh:"Amp Overdrive 在 Amp 内部产生；Pedal Overdrive 先改变送进 Amp 的信号。",en:"Amp overdrive happens inside the amp; a pedal shapes the signal before it.",ja:"Amp Overdrive は Amp 内、Pedal Overdrive は Amp 前の信号を変えます。"}]],position:{zh:"通常位于 Amp 之前。",en:"Usually before the amp.",ja:"通常は Amp の前です。"},experiment:{zh:"比较只用 Amp Gain、Pedal 自身失真、低 Drive／高 Level 推 Amp 三种状态。重点听动态、低频与和弦清晰度。",en:"Compare amp-only gain, pedal distortion, and low Drive/high Level boost. Listen to dynamics, lows and chord clarity.",ja:"Amp のみ、Pedal の歪み主体、Drive 低／Level 高の3通りを比較します。"}},
"Distortion":{f:"drive",v:"drive",n:{zh:"失真",en:"Distortion",ja:"ディストーション"},t:{zh:"产生更明显、更稳定的饱和失真，让声音更厚、更紧且更有攻击性。",en:"Creates stronger, more consistent saturation for thicker, tighter, more aggressive tone.",ja:"より強く安定した飽和歪みで、厚くタイトで攻撃的な音にします。"},hear:{zh:["厚重","紧实","攻击性","压缩更多","谐波密集"],en:["Thick","Tight","Aggressive","Compressed","Dense harmonics"],ja:["厚い","タイト","攻撃的","圧縮感","倍音が密"]},styles:["Hard Rock","Punk","Metal","Alternative"],change:{zh:"更强地削平波形，并通过前后 EQ 形成稳定失真性格。",en:"Clips more strongly and uses pre/post EQ for a consistent character.",ja:"波形を強くクリップし、前後 EQ で安定した歪みを作ります。"},controls:[["Gain",{zh:"增加饱和、压缩与谐波密度。",en:"Adds saturation, compression and harmonic density.",ja:"飽和、圧縮、倍音密度を増やします。"}],["Tone",{zh:"改变失真的明暗与攻击感。",en:"Changes brightness and bite.",ja:"明るさとアタック感を変えます。"}]],compare:[["Fuzz",{zh:"Fuzz 更破碎、更毛茸茸，可能明显改变原始轮廓。",en:"Fuzz is more broken, hairy and transformative.",ja:"Fuzz はより壊れた、毛羽立つ質感です。"}]],position:{zh:"通常位于 Amp 之前。",en:"Usually before the amp.",ja:"通常は Amp の前です。"},experiment:{zh:"用 Power Chord 与 Palm Mute 增加 Gain，听厚度何时开始变成和弦分离度下降。",en:"Use power chords and palm mutes; raise gain until thickness becomes lost separation.",ja:"Power Chord と Palm Mute で Gain を上げ、分離が失われる地点を聴きます。"}},
"Fuzz":{f:"drive",v:"drive",n:{zh:"法兹",en:"Fuzz",ja:"ファズ"},t:{zh:"产生强烈、粗糙、毛茸茸的削波，常带有破碎和复古质感。",en:"Creates intense, rough, hairy clipping with a broken vintage character.",ja:"強く粗い、毛羽立つクリッピングでヴィンテージ感を作ります。"},hear:{zh:["毛茸茸","破碎","粗糙","复古"],en:["Hairy","Broken","Raw","Vintage"],ja:["毛羽立つ","壊れた感じ","荒い","ヴィンテージ"]},styles:["Psychedelic","Garage Rock","Stoner Rock"],change:{zh:"使用极强削波，压缩并重构原始波形。",en:"Uses extreme clipping that compresses and reshapes the waveform.",ja:"非常に強いクリッピングで波形を再構成します。"},controls:[["Fuzz",{zh:"决定破碎、压缩与饱和程度。",en:"Controls breakup, compression and saturation.",ja:"崩れ、圧縮、飽和の量を決めます。"}],["Tone",{zh:"调整高频毛刺与厚度。",en:"Balances rasp and body.",ja:"高域のザラつきと太さを調整します。"}]],compare:[["Distortion",{zh:"Distortion 通常更紧、更可控；Fuzz 更夸张。",en:"Distortion is tighter and more controlled; Fuzz is more extreme.",ja:"Distortion はタイト、Fuzz はより極端です。"}]],position:{zh:"通常位于链路前端。",en:"Usually early in the chain.",ja:"通常はチェイン前段です。"},experiment:{zh:"用持续单音和简单 Riff，调整 Guitar Volume，听 Fuzz 是否逐渐清理。",en:"Use held notes and a simple riff; roll down guitar volume and hear whether it cleans up.",ja:"ロングトーンで Guitar Volume を下げ、クリーンアップを確認します。"}},
"Graphic EQ":{f:"eq",v:"eq",n:{zh:"图示均衡器",en:"Graphic EQ",ja:"グラフィック EQ"},t:{zh:"用固定频段推子增加或减少特定频率。",en:"Uses fixed-band sliders to boost or cut frequencies.",ja:"固定周波数帯をスライダーでブースト／カットします。"},hear:{zh:["频率轮廓变化","更亮或更暗","低频收紧","中频突出"],en:["Frequency shape","Brighter/darker","Tighter lows","Focused mids"],ja:["周波数変化","明暗","低域を締める","中域強調"]},styles:["Metal Rhythm","Lead Boost","Tone Correction"],change:{zh:"改变多个固定频段的电平。",en:"Changes the level of several fixed bands.",ja:"複数の固定周波数帯を変えます。"},controls:[["Band Sliders",{zh:"每个推子对应一个固定频段。",en:"Each slider controls one fixed band.",ja:"各スライダーが固定帯域を担当します。"}]],compare:[["Parametric EQ",{zh:"Parametric EQ 可以选择中心频率和带宽，控制更精细。",en:"Parametric EQ selects frequency and bandwidth for finer control.",ja:"Parametric EQ は周波数と帯域幅を選べます。"}]],position:{zh:"可位于 Amp 前或后。Amp 前影响失真反应，Amp 后更像最终修整。",en:"Can sit before or after the amp; before changes distortion response, after refines the result.",ja:"Amp 前後に置け、前は歪み方、後は最終補正に影響します。"},experiment:{zh:"所有频段归零，一次只改变一个频段，描述它改变的是重量、主体还是亮度。",en:"Start flat and move one band at a time; name weight, body or brightness.",ja:"すべて 0 から始め、1帯域ずつ動かします。"}},
"Wah":{f:"eq",v:"eq",n:{zh:"哇音",en:"Wah",ja:"ワウ"},t:{zh:"移动一个突出的频率区域，产生类似人声“哇”的扫频和表情。",en:"Moves a resonant frequency peak for vocal-like sweeps and expression.",ja:"共振周波数を動かし、人声のようなワウを作ります。"},hear:{zh:["哇音扫频","鼻音","表情","节奏感"],en:["Vocal sweep","Nasal","Expressive","Rhythmic"],ja:["ワウ・スイープ","鼻にかかる音","表情","リズム感"]},styles:["Funk","Rock Lead","Fusion"],change:{zh:"让一个高共振滤波频率随踏板位置移动。",en:"Moves a resonant filter frequency with pedal position.",ja:"ペダル位置に合わせて共振フィルターを動かします。"},controls:[["Pedal Position",{zh:"决定突出低频、中频还是高频。",en:"Selects lower, middle or higher emphasis.",ja:"低／中／高どこを強調するか決めます。"}],["Q",{zh:"决定哇音峰值有多尖锐。",en:"Controls how sharp the peak is.",ja:"ピークの鋭さを決めます。"}]],compare:[["Phaser",{zh:"Phaser 是多个相位凹陷周期移动；Wah 是明显共振峰由用户控制。",en:"Phaser moves multiple phase notches; Wah moves one resonant peak.",ja:"Phaser は複数ノッチ、Wah は1つの共振ピークです。"}]],position:{zh:"通常位于 Drive 前，也可放在 Drive 后获得更强扫频。",en:"Usually before Drive; after Drive creates a stronger sweep.",ja:"通常は Drive 前、後に置くと強いスイープになります。"},experiment:{zh:"保持长音并缓慢移动踏板，听频率峰值怎样经过低、中、高频。",en:"Hold one note and move the pedal slowly across lows, mids and highs.",ja:"ロングトーンでゆっくり踏み、周波数移動を聴きます。"}},
"Chorus":{f:"mod",v:"mod",n:{zh:"合唱",en:"Chorus",ja:"コーラス"},t:{zh:"把原音与轻微延迟、轻微音高漂移的副本叠加，让声音变宽、柔和并带漂浮感。",en:"Layers dry sound with a slightly delayed, detuned copy for width, softness and float.",ja:"原音にわずかな遅れとピッチ揺れを重ね、広がりと漂いを加えます。"},hear:{zh:["变宽","两层声音","柔和","漂浮"],en:["Wider","Layered","Soft","Floating"],ja:["広がる","二重感","柔らかい","漂う"]},styles:["City Pop","Dream Pop","80s Pop","Clean Rock"],change:{zh:"周期性改变极短延迟，并通常保留 Dry Signal 与变化后的副本叠加。",en:"Modulates a very short delay and usually mixes it with dry.",ja:"極短 Delay を周期変化させ、通常 Dry と混ぜます。"},controls:[["Rate",{zh:"决定摆动速度。",en:"Controls movement speed.",ja:"揺れの速さを決めます。"}],["Depth",{zh:"决定音高和短延迟变化有多明显。",en:"Controls movement depth.",ja:"変化の深さを決めます。"}],["Mix",{zh:"决定副本比例。",en:"Controls effected copy level.",ja:"エフェクト音の割合を決めます。"}]],compare:[["Vibrato",{zh:"Chorus 通常保留 Dry；Vibrato 主要让整个声音改变音高。",en:"Chorus normally keeps dry; Vibrato mainly moves the whole pitch.",ja:"Chorus は Dry を残し、Vibrato は音全体のピッチを揺らします。"}],["Delay",{zh:"Chorus 延迟极短，不形成清楚独立回声。",en:"Chorus delay is too short to become a distinct echo.",ja:"Chorus の Delay は短く、独立したエコーになりません。"}]],position:{zh:"常见于 Amp 后、Delay / Reverb 前。",en:"Commonly after amp and before Delay / Reverb.",ja:"Amp 後、Delay / Reverb 前が一般的です。"},experiment:{zh:"用 Clean Arpeggio，从慢 Rate、低 Depth、少量 Mix 开始，听声音是否向两侧展开。",en:"Use a clean arpeggio with slow Rate, low Depth and low Mix; listen for width.",ja:"Clean Arpeggio で Rate を遅く、Depth / Mix を低くし、広がりを聴きます。"}},
"Phaser":{f:"mod",v:"mod",n:{zh:"移相",en:"Phaser",ja:"フェイザー"},t:{zh:"让多个频率区域周期性增强和削弱，产生圆润旋转与中频扫动。",en:"Moves phase cancellations for a rounded rotating sweep.",ja:"位相の打ち消しを動かし、丸い回転感を作ります。"},hear:{zh:["圆润旋转","空心","中频扫动","迷幻"],en:["Rounded rotation","Hollow","Mid sweep","Psychedelic"],ja:["丸い回転","空洞感","中域スイープ","サイケ"]},styles:["Funk","Psychedelic","Classic Rock"],change:{zh:"改变频率之间的相位关系，形成移动峰值与凹陷。",en:"Changes phase relationships to create moving peaks and notches.",ja:"周波数間の位相関係を変え、ピークとノッチを動かします。"},controls:[["Rate",{zh:"决定扫动速度。",en:"Controls sweep speed.",ja:"スイープ速度を決めます。"}],["Depth",{zh:"决定移动范围。",en:"Controls sweep range.",ja:"範囲を決めます。"}],["Feedback",{zh:"增加共振与旋转感。",en:"Adds resonance and rotation.",ja:"共振と回転感を強めます。"}]],compare:[["Flanger",{zh:"Flanger 更金属、更像喷气机；Phaser 通常更圆润。",en:"Flanger is more metallic and jet-like; Phaser is rounder.",ja:"Flanger は金属的、Phaser はより丸い傾向です。"}]],position:{zh:"通常位于 Drive 后。",en:"Often after Drive.",ja:"通常は Drive 後です。"},experiment:{zh:"使用持续和弦，固定 Depth，只改变 Rate，听扫动速度而不是宽度。",en:"Use a held chord, keep Depth fixed and vary Rate; hear sweep rather than width.",ja:"持続コードで Depth を固定し Rate を変えます。"}},
"Flanger":{f:"mod",v:"mod",n:{zh:"镶边",en:"Flanger",ja:"フランジャー"},t:{zh:"把变化的极短延迟与原音混合，产生金属扫动和喷气机感。",en:"Mixes a changing ultra-short delay with dry for metallic jet-like sweeps.",ja:"変化する極短 Delay を原音と混ぜ、金属的なジェット感を作ります。"},hear:{zh:["金属扫动","喷气机","梳状感","强烈运动"],en:["Metallic sweep","Jet-like","Comb filtering","Strong motion"],ja:["金属的スイープ","ジェット感","コーム感","強い動き"]},styles:["Psychedelic","Alternative","Special FX"],change:{zh:"利用极短延迟和 Feedback 产生移动梳状滤波。",en:"Uses ultra-short delay and feedback for moving comb filtering.",ja:"極短 Delay と Feedback でコームフィルターを動かします。"},controls:[["Rate",{zh:"决定扫动速度。",en:"Controls sweep speed.",ja:"速度を決めます。"}],["Depth",{zh:"决定延迟变化范围。",en:"Controls delay range.",ja:"変化範囲を決めます。"}],["Feedback",{zh:"增加金属共振。",en:"Adds metallic resonance.",ja:"金属的な共振を強めます。"}]],compare:[["Phaser",{zh:"Phaser 更柔和圆润；Flanger 更金属明显。",en:"Phaser is softer and rounder; Flanger is more metallic.",ja:"Phaser は柔らかく、Flanger は金属的です。"}]],position:{zh:"通常位于 Drive 后、Delay 前。",en:"Usually after Drive and before Delay.",ja:"通常は Drive 後、Delay 前です。"},experiment:{zh:"用持续和弦，从低 Feedback 开始增加 Depth，听轻微运动何时变成金属扫动。",en:"Use a held chord with low Feedback, raise Depth until motion becomes metallic.",ja:"持続コードで Feedback を低くし、Depth を上げます。"}},
"Tremolo":{f:"mod",v:"mod",n:{zh:"音量颤音",en:"Tremolo",ja:"トレモロ"},t:{zh:"周期性改变音量，让声音像灯光一样忽明忽暗。",en:"Periodically changes volume so the sound pulses like a light.",ja:"音量を周期的に変え、光の明滅のような脈動を作ります。"},hear:{zh:["忽大忽小","脉冲","节奏摇摆","复古"],en:["Volume pulse","Rhythmic","Chop","Vintage"],ja:["音量の脈動","リズム感","刻み","ヴィンテージ"]},styles:["Surf","Vintage Amp","Indie"],change:{zh:"使用周期信号控制音量。",en:"Uses a periodic signal to control volume.",ja:"周期信号で音量を変化させます。"},controls:[["Rate",{zh:"决定脉冲速度。",en:"Controls pulse speed.",ja:"脈動の速さを決めます。"}],["Depth",{zh:"决定音量变化幅度。",en:"Controls pulse depth.",ja:"変化の深さを決めます。"}]],compare:[["Vibrato",{zh:"Tremolo 改变音量；Vibrato 改变音高。",en:"Tremolo changes volume; Vibrato changes pitch.",ja:"Tremolo は音量、Vibrato は音程を変えます。"}]],position:{zh:"常见于 Amp 后段。",en:"Often late in the amp/effect chain.",ja:"Amp 後段が一般的です。"},experiment:{zh:"保持一个长音，先只改变 Rate，再只改变 Depth，分别识别速度和幅度。",en:"Hold one note; change Rate and Depth separately.",ja:"ロングトーンで Rate と Depth を別々に変えます。"}},
"Vibrato":{f:"mod",v:"mod",n:{zh:"音高颤音",en:"Vibrato",ja:"ビブラート"},t:{zh:"周期性改变音高，产生摇摆、不稳定、磁带晃动或梦幻感。",en:"Periodically changes pitch for wobble, instability and tape-like movement.",ja:"音程を周期的に変え、揺れやテープ感を作ります。"},hear:{zh:["音高摇摆","不稳定","磁带感","梦幻"],en:["Pitch wobble","Unstable","Tape-like","Dreamy"],ja:["ピッチの揺れ","不安定","テープ感","夢幻的"]},styles:["Lo-fi","Dream Pop","Vintage"],change:{zh:"让整个处理信号的音高围绕中心上下移动。",en:"Moves the pitch of the processed signal above and below center.",ja:"処理音全体のピッチを上下に動かします。"},controls:[["Rate",{zh:"决定音高摆动速度。",en:"Controls wobble speed.",ja:"揺れの速さを決めます。"}],["Depth",{zh:"决定跑音幅度。",en:"Controls pitch deviation.",ja:"ピッチ変化幅を決めます。"}]],compare:[["Chorus",{zh:"Chorus 通常保留 Dry 并叠加副本；Vibrato 主要只保留变化后的声音。",en:"Chorus mixes a shifted copy with dry; Vibrato mainly uses shifted sound.",ja:"Chorus は Dry と変化音を重ね、Vibrato は主に変化音を使います。"}]],position:{zh:"通常位于 Drive 后、Delay 前。",en:"Usually after Drive and before Delay.",ja:"通常は Drive 後、Delay 前です。"},experiment:{zh:"用持续单音从低 Depth 开始，听轻微摇摆何时变成明显跑调。",en:"Use a held note and raise Depth until gentle wobble becomes obvious detuning.",ja:"ロングトーンで Depth を上げ、音外れになる地点を聴きます。"}},
"Digital Delay":{f:"delay",v:"delay",n:{zh:"数字延迟",en:"Digital Delay",ja:"デジタル・ディレイ"},t:{zh:"产生清楚、明亮、较忠实于原音的重复。",en:"Creates clear, bright repeats faithful to the source.",ja:"原音に近い、明瞭で明るい反復を作ります。"},hear:{zh:["清楚重复","节奏明确","高频保留","轨迹清晰"],en:["Clear repeats","Defined rhythm","Bright echoes","Precise trail"],ja:["明瞭な反復","はっきりしたリズム","明るいエコー","正確"]},styles:["Modern Lead","Pop","Post-Rock"],change:{zh:"按设定时间复制原始信号，并可把重复送回输入。",en:"Copies the signal after a set time and feeds repeats back.",ja:"設定時間後に信号を複製し、反復を入力へ戻します。"},controls:[["Time",{zh:"决定重复间隔。",en:"Controls spacing between repeats.",ja:"反復間隔を決めます。"}],["Feedback",{zh:"决定重复次数。",en:"Controls number of repeats.",ja:"繰り返し回数を決めます。"}],["Mix",{zh:"决定重复比例。",en:"Controls repeat level.",ja:"反復音の割合を決めます。"}]],compare:[["Reverb",{zh:"Delay 是可辨认的独立重复；Reverb 是密集融合的反射。",en:"Delay creates distinct repeats; Reverb creates dense blended reflections.",ja:"Delay は独立した反復、Reverb は密集した反射です。"}],["Sustain",{zh:"Sustain 是原始音符继续保持，不是出现新重复。",en:"Sustain is the original note continuing, not a new repeat.",ja:"Sustain は原音が伸びることで、新しい反復ではありません。"}]],position:{zh:"通常位于 Modulation 后、Reverb 前。",en:"Usually after Modulation and before Reverb.",ja:"通常は Modulation 後、Reverb 前です。"},experiment:{zh:"Feedback 与 Mix 设低，只保留一次清楚重复，再改变 Time，听厚度何时变成独立回声。",en:"Use one low-level repeat and change Time until thickness becomes a separate echo.",ja:"1回の反復で Time を変え、厚みからエコーへの変化を聴きます。"}},
"Analog Delay":{f:"delay",v:"delay",n:{zh:"模拟延迟",en:"Analog Delay",ja:"アナログ・ディレイ"},t:{zh:"重复会逐渐变暗、变软，与原音融合得更自然。",en:"Repeats become darker and softer, blending into dry sound.",ja:"反復が徐々に暗く柔らかくなり、原音になじみます。"},hear:{zh:["温暖回声","逐渐变暗","柔和","融合"],en:["Warm echoes","Darker repeats","Soft","Blended"],ja:["温かいエコー","暗い反復","柔らかい","なじむ"]},styles:["Classic Lead","Ambient","Indie"],change:{zh:"每次反馈会损失高频并增加轻微不完美。",en:"Each feedback pass loses highs and gains imperfection.",ja:"Feedback ごとに高域が減り、不完全さが加わります。"},controls:[["Time",{zh:"决定重复间隔。",en:"Controls spacing.",ja:"反復間隔を決めます。"}],["Feedback",{zh:"高设置可能接近自激。",en:"High values may approach self-oscillation.",ja:"高くすると自己発振に近づきます。"}],["Mix",{zh:"决定温暖重复比例。",en:"Controls dark repeat level.",ja:"暗い反復音の割合を決めます。"}]],compare:[["Digital Delay",{zh:"Digital Delay 通常更清楚、明亮和精确。",en:"Digital Delay is clearer, brighter and more precise.",ja:"Digital Delay は明瞭で明るく正確です。"}]],position:{zh:"通常位于 Modulation 后、Reverb 前。",en:"Usually after Modulation and before Reverb.",ja:"通常は Modulation 後、Reverb 前です。"},experiment:{zh:"与 Digital Delay 使用相同 Time 和 Feedback，对比重复高频怎样衰减。",en:"Match Time and Feedback with Digital Delay and compare high-frequency loss.",ja:"Digital Delay と同じ設定で高域減衰を比較します。"}},
"Tape Echo":{f:"delay",v:"delay",n:{zh:"磁带回声",en:"Tape Echo",ja:"テープ・エコー"},t:{zh:"在重复中加入磁带压缩、轻微音高晃动和复古质感。",en:"Adds tape compression, pitch instability and vintage texture to repeats.",ja:"反復にテープ圧縮、ピッチ揺れ、ヴィンテージ感を加えます。"},hear:{zh:["温暖","晃动","复古","重复老化"],en:["Warm","Wobbly","Vintage","Aging repeats"],ja:["温かい","揺れる","ヴィンテージ","古びる反復"]},styles:["Vintage Rock","Dub","Ambient"],change:{zh:"模拟磁带录放中的饱和、频率损失和机械不稳定。",en:"Models tape saturation, frequency loss and mechanical instability.",ja:"テープ録再の飽和、周波数損失、機械的不安定を再現します。"},controls:[["Time",{zh:"改变时可能出现音高滑动。",en:"Changing it may create pitch glides.",ja:"変更時にピッチが滑る場合があります。"}],["Feedback",{zh:"增加重复和磁带退化累积。",en:"Adds repeats and tape degradation.",ja:"反復と劣化を増やします。"}],["Wow / Flutter",{zh:"控制音高不稳定。",en:"Controls pitch instability.",ja:"ピッチ揺れを調整します。"}]],compare:[["Analog Delay",{zh:"两者都温暖，但 Tape Echo 通常有更明显的晃动与饱和。",en:"Both are warm, but Tape Echo has more wobble and saturation.",ja:"Tape Echo は揺れと飽和がより明確です。"}]],position:{zh:"通常位于 Modulation 后、Reverb 前。",en:"Usually after Modulation and before Reverb.",ja:"通常は Modulation 後、Reverb 前です。"},experiment:{zh:"低 Feedback 下提高 Wow / Flutter，听重复从稳定变成轻微晃动。",en:"Raise Wow/Flutter with low Feedback and hear stable repeats wobble.",ja:"Feedback を低くし Wow / Flutter を上げます。"}},
"Room Reverb":{f:"reverb",v:"reverb",n:{zh:"房间混响",en:"Room Reverb",ja:"ルーム・リバーブ"},t:{zh:"模拟较小空间的自然反射，让声音更真实但仍保持靠近。",en:"Simulates a smaller natural space, adding realism while staying close.",ja:"小さな自然空間を再現し、近さを保ちながら実在感を加えます。"},hear:{zh:["自然","较近","短尾音","轻微环境"],en:["Natural","Close","Short tail","Subtle ambience"],ja:["自然","近い","短い残響","軽い空気感"]},styles:["Rhythm","Clean","Natural Studio"],change:{zh:"加入较短、密集的早期反射和尾音。",en:"Adds short, dense early reflections and a restrained tail.",ja:"短く密集した初期反射と控えめな残響を加えます。"},controls:[["Decay",{zh:"决定尾音长度。",en:"Controls tail length.",ja:"残響の長さを決めます。"}],["Pre-delay",{zh:"决定原音与反射开始的间隔。",en:"Sets the gap before reflections begin.",ja:"原音と反射開始の間隔を決めます。"}],["Mix",{zh:"决定房间感比例。",en:"Controls room amount.",ja:"空間感の割合を決めます。"}]],compare:[["Hall Reverb",{zh:"Hall 更大、更长、更远。",en:"Hall is larger, longer and more distant.",ja:"Hall はより大きく長く遠く感じます。"}]],position:{zh:"通常位于 Delay 后、接近链路末端。",en:"Usually after Delay near the end.",ja:"通常は Delay 後、チェイン終盤です。"},experiment:{zh:"从低 Mix、短 Decay 开始，目标是增加自然环境而不让声音明显后退。",en:"Start with low Mix and short Decay; add ambience without pushing the sound back.",ja:"Mix 低／Decay 短から始め、距離を増やしすぎないようにします。"}},
"Hall Reverb":{f:"reverb",v:"reverb",n:{zh:"大厅混响",en:"Hall Reverb",ja:"ホール・リバーブ"},t:{zh:"模拟大型空间，产生更长、更深、更包围的尾音。",en:"Simulates a large space with a longer, deeper, enveloping tail.",ja:"大きな空間を再現し、長く深い残響を作ります。"},hear:{zh:["空间大","尾音长","声音更远","包围感"],en:["Large","Long tail","Distant","Enveloping"],ja:["大空間","長い残響","遠い","包まれる"]},styles:["Ambient","Lead","Ballad"],change:{zh:"增加更长、更密集的反射与更大的感知空间。",en:"Adds longer, denser reflections and a larger perceived space.",ja:"長く密集した反射と大きな空間感を加えます。"},controls:[["Decay",{zh:"决定大厅尾音持续多久。",en:"Controls tail duration.",ja:"残響の長さを決めます。"}],["Pre-delay",{zh:"适量增加可以保留拨弦清晰度。",en:"A little can preserve pick clarity.",ja:"少量でピッキングの明瞭さを保てます。"}],["Mix",{zh:"过高会让声音明显后退。",en:"Too much pushes the sound back.",ja:"高すぎると音が遠くなります。"}]],compare:[["Delay",{zh:"Hall 是融合尾音，不是可数的独立重复。",en:"Hall is a blended tail, not countable repeats.",ja:"Hall は融合した残響で、数えられる反復ではありません。"}]],position:{zh:"通常位于声音链末端。",en:"Usually near the end.",ja:"通常はチェイン終盤です。"},experiment:{zh:"用间隔清楚的短音，分别调整 Mix 与 Decay，区分空间比例和尾音长度。",en:"Use separated notes and change Mix and Decay independently.",ja:"間隔のある音で Mix と Decay を別々に変えます。"}},
"Spring Reverb":{f:"reverb",v:"reverb",n:{zh:"弹簧混响",en:"Spring Reverb",ja:"スプリング・リバーブ"},t:{zh:"产生有弹性、金属感和滴水感的复古尾音。",en:"Creates a bouncy, metallic, drippy vintage tail.",ja:"弾むような金属感とドリップ感のある残響を作ります。"},hear:{zh:["弹性","金属感","滴水感","复古"],en:["Bouncy","Metallic","Drippy","Vintage"],ja:["弾む","金属的","ドリップ感","ヴィンテージ"]},styles:["Surf Rock","Vintage Amp","Rockabilly"],change:{zh:"模拟实体弹簧中的机械振动和反射。",en:"Models mechanical vibration in physical springs.",ja:"実物スプリングの機械振動を再現します。"},controls:[["Dwell",{zh:"决定送入弹簧的信号强度。",en:"Controls how hard the springs are driven.",ja:"スプリングへ送る信号量を決めます。"}],["Tone",{zh:"调整金属尾音明暗。",en:"Shapes tail brightness.",ja:"残響の明るさを調整します。"}],["Mix",{zh:"决定弹簧声音比例。",en:"Controls spring level.",ja:"スプリング音の割合を決めます。"}]],compare:[["Plate Reverb",{zh:"Spring 更有弹性与机械瞬态。",en:"Spring is bouncier and more mechanical.",ja:"Spring はより弾力的で機械的です。"}]],position:{zh:"传统上常位于 Amp 内部，也可作为链路末端效果。",en:"Traditionally inside the amp or late in the chain.",ja:"伝統的には Amp 内蔵、またはチェイン終盤です。"},experiment:{zh:"用短促拨弦或闷音，听特有金属瞬态，而不只是尾音长度。",en:"Use short picked notes and listen for metallic transients, not only tail length.",ja:"短い音で金属的な瞬間音を聴きます。"}},
"Octaver":{f:"pitch",v:"pitch",n:{zh:"八度效果",en:"Octaver",ja:"オクターバー"},t:{zh:"在原音上方或下方加入一个或多个八度音。",en:"Adds one or more octaves above or below the original.",ja:"原音の1オクターブ上／下を加えます。"},hear:{zh:["低八度厚度","高八度亮度","合成感","双层音高"],en:["Low octave weight","High octave sheen","Synth-like","Layered pitch"],ja:["低オクターブの太さ","高オクターブ","シンセ感","重なり"]},styles:["Bass-like Riff","Fuzz Lead","Modern Rock"],change:{zh:"检测音高并生成固定八度关系的副本。",en:"Tracks pitch and creates fixed octave copies.",ja:"音程を検出し、固定オクターブ音を生成します。"},controls:[["Octave Down",{zh:"增加低八度比例。",en:"Adds lower octave.",ja:"下オクターブを増やします。"}],["Octave Up",{zh:"增加高八度比例。",en:"Adds upper octave.",ja:"上オクターブを増やします。"}],["Dry",{zh:"控制原音比例。",en:"Controls dry level.",ja:"原音レベルを調整します。"}]],compare:[["Harmonizer",{zh:"Octaver 使用固定八度；Harmonizer 可根据音阶生成三度、五度等。",en:"Octaver uses fixed octaves; Harmonizer creates scale-aware intervals.",ja:"Octaver は固定オクターブ、Harmonizer は音階に沿った音程です。"}]],position:{zh:"通常位于 Drive 前以获得稳定追踪。",en:"Usually before Drive for stable tracking.",ja:"安定した追従のため通常は Drive 前です。"},experiment:{zh:"先弹单音并加入少量低八度，不要一开始使用复杂和弦。",en:"Start with single notes and a little octave down.",ja:"まず単音で下オクターブを少量加えます。"}},
"Pitch Shifter":{f:"pitch",v:"pitch",n:{zh:"移调效果",en:"Pitch Shifter",ja:"ピッチ・シフター"},t:{zh:"把声音移动到另一个音高，用于固定音程、特殊滑音与转调。",en:"Moves sound to another pitch for intervals, expressive shifts and transposition.",ja:"音を別の音程へ移動し、固定音程や移調に使います。"},hear:{zh:["整体升降","固定音程","滑音","数字感"],en:["Pitch up/down","Fixed interval","Glide","Digital"],ja:["音程上下","固定音程","グライド","デジタル感"]},styles:["Modern Lead","Whammy FX","Experimental"],change:{zh:"重新构造声音的音高。",en:"Reconstructs the signal at a different pitch.",ja:"信号を別の音程へ再構成します。"},controls:[["Interval",{zh:"决定移动多少半音。",en:"Sets pitch interval.",ja:"移動する半音を決めます。"}],["Mix",{zh:"决定原音与移调音比例。",en:"Balances dry and shifted signals.",ja:"原音とシフト音の割合を決めます。"}]],compare:[["Vibrato",{zh:"Vibrato 只在中心附近摇摆；Pitch Shifter 可移动到明确新音程。",en:"Vibrato wobbles around center; Pitch Shifter moves to a defined interval.",ja:"Vibrato は中心付近の揺れ、Pitch Shifter は明確な音程へ移動します。"}]],position:{zh:"准确追踪时通常位于 Drive 前。",en:"Usually before Drive for clean tracking.",ja:"正確な追従には通常 Drive 前です。"},experiment:{zh:"先设置 +12 或 -12 半音并弹单音，确认八度关系，再尝试其他音程。",en:"Start at +12 or -12 semitones on single notes.",ja:"まず ±12 半音で単音を弾きます。"}},
"Volume":{f:"utility",v:"utility",n:{zh:"音量控制",en:"Volume",ja:"ボリューム"},t:{zh:"控制整体电平，可用于静音、渐入渐出或 Solo 提升。",en:"Controls level for mute, swells or solo boosts.",ja:"全体レベルを制御し、ミュートやスウェルに使います。"},hear:{zh:["更响或更小","渐入渐出","静音"],en:["Louder/softer","Swells","Mute"],ja:["音量上下","スウェル","ミュート"]},styles:["Ambient Swell","Live Control","Solo"],change:{zh:"直接改变信号电平，位置不同会影响失真量或最终音量。",en:"Directly changes level; placement determines distortion or final volume.",ja:"信号レベルを変え、位置によって歪み量か最終音量に影響します。"},controls:[["Level",{zh:"决定信号通过比例。",en:"Controls passed signal level.",ja:"通過する信号量を決めます。"}]],compare:[["Gain",{zh:"Gain 常影响某级被推动的程度；Volume 更强调最终听到的电平。",en:"Gain drives a stage; Volume focuses on audible level.",ja:"Gain は段を押し、Volume は聴こえる音量を変えます。"}]],position:{zh:"Drive 前影响失真量；Drive 后更像最终音量。",en:"Before Drive changes distortion; after Drive changes final level.",ja:"Drive 前は歪み量、後は最終音量です。"},experiment:{zh:"分别把 Volume 放在 Drive 前后，比较失真量与最终音量的差别。",en:"Place Volume before and after Drive and compare the result.",ja:"Drive 前後に置き、違いを比較します。"}},

const tool=[{id:"clean",label:{zh:"原始声音",en:"Source",ja:"原音"},color:"#aaa",cap:{zh:"原始信号保留拨弦、动态与拾音器性格。",en:"The source retains attack, dynamics and pickup character.",ja:"原音にはアタック、ダイナミクス、Pickup の性格があります。"}},{id:"drive",label:{zh:"失真类",en:"Drive",ja:"Drive"},color:F.drive.c,cap:{zh:"Drive 增加削波、压缩与谐波，让声音变得温暖、粗糙或有攻击性。",en:"Drive adds clipping, compression and harmonics.",ja:"Drive はクリッピング、圧縮、倍音を加えます。"}},{id:"mod",label:{zh:"调制类",en:"Modulation",ja:"Modulation"},color:F.mod.c,cap:{zh:"Modulation 让音量、音高、相位或短延迟周期变化，产生运动感。",en:"Modulation periodically moves volume, pitch, phase or short delay.",ja:"Modulation は音量、音程、位相、短い Delay を周期変化させます。"}},{id:"delay",label:{zh:"延迟类",en:"Delay",ja:"Delay"},color:F.delay.c,cap:{zh:"Delay 让声音在稍后再次出现，形成可辨认的重复。",en:"Delay brings sound back later as distinct repeats.",ja:"Delay は音を後から再生し、明確な反復を作ります。"}},{id:"reverb",label:{zh:"混响类",en:"Reverb",ja:"Reverb"},color:F.reverb.c,cap:{zh:"Reverb 把大量反射融合成空间尾音。",en:"Reverb blends reflections into a spatial tail.",ja:"Reverb は反射を残響へまとめます。"}}];
function renderTool(){toolTabs.innerHTML="";tool.forEach(m=>{const b=document.createElement("button");b.className="tool-tab "+(S.tool===m.id?"active":"");b.style.setProperty("--color",m.color);b.innerHTML=`<span>${m.id.toUpperCase()}</span><strong>${L(m.label)}</strong>`;b.onclick=()=>{S.tool=m.id;renderTool()};toolTabs.appendChild(b)});sound.dataset.mode=S.tool;toolCaption.textContent=L(tool.find(x=>x.id===S.tool).cap)}
function displayName(k){const e=E[k],local=L(e.n);return S.lang==="en"?local:`${local}<span class="canonical">${k}</span>`}
function terms(k){const e=E[k],f=F[e.f];return [k,L(e.n),L(e.t),L(f.n),f.code,...e.styles,...e.hear.zh,...e.hear.en,...e.hear.ja].join(" ").toLowerCase()}
function renderFamilies(){familyList.innerHTML="";Object.entries(F).forEach(([k,f],i)=>{if(k==="amp"){const d=document.createElement("div");d.className="divider";familyList.appendChild(d)}const b=document.createElement("button");b.className="family-btn "+(S.family===k?"active":"");b.style.setProperty("--color",f.c);b.innerHTML=`<i class="dot"></i><b>${L(f.n)}</b><small>${String(i+1).padStart(2,"0")}</small>`;b.onclick=()=>{S.family=k;S.effect=f.e[0];search.value="";renderLibrary()};familyList.appendChild(b)})}
search.oninput=()=>renderLibrary();
function renderLibrary(){renderFamilies();const q=search.value.trim().toLowerCase();let keys=q?Object.keys(E).filter(k=>terms(k).includes(q)):F[S.family].e;if(q&&keys.length&&!keys.includes(S.effect)){S.effect=keys[0];S.family=E[S.effect].f;return renderLibrary()}const f=F[S.family];familyTitle.textContent=L(f.n);familyCode.textContent=f.code;familyDesc.textContent=L(f.d);familyHear.innerHTML=f.h[S.lang].map(x=>`<span class="keyword">${x}</span>`).join("");cards.innerHTML="";if(!keys.length){cards.innerHTML=`<p class="muted">${copy[S.lang].noResult}</p>`;detail.innerHTML="";return}if(!keys.includes(S.effect))S.effect=keys[0];keys.forEach(k=>{const e=E[k],ff=F[e.f],b=document.createElement("button");b.className="card "+(S.effect===k?"active":"");b.style.setProperty("--color",ff.c);b.innerHTML=`<small>${ff.code}</small><h3>${displayName(k)}</h3><p>${L(e.t)}</p>`;b.onclick=()=>{S.effect=k;S.family=e.f;renderLibrary();detail.scrollIntoView({behavior:"smooth",block:"start"})};cards.appendChild(b)});renderDetail()}
function controls(v){return {drive:[["Intensity",62],["Tone",55]],dynamics:[["Control",58],["Release",48]],eq:[["Low",45],["Mid",65],["High",52]],mod:[["Rate",40],["Depth",58]],delay:[["Time",52],["Feedback",44]],reverb:[["Size",60],["Decay",63]],pitch:[["Interval",67],["Mix",52]],utility:[["Level",58],["Route",42]],amp:[["Gain",56],["Character",60]]}[v]}
function visual(v,a,b,c,color){if(v==="drive"){let d="M10 100";const amp=8+a*.13,clip=50-a*.28;for(let x=10;x<290;x+=4){let y=100-Math.sin(x/19)*amp;y=Math.max(clip,Math.min(200-clip,y));d+=` L${x} ${y}`}return `<svg viewBox="0 0 300 200"><path d="${d}" fill="none" stroke="${color}" stroke-width="4"/><path d="M10 ${clip}H290M10 ${200-clip}H290" stroke="#111" stroke-dasharray="3 7" opacity=".25"/></svg>`}if(v==="dynamics"){const hs=[35,80,48,105,62,125,42],t=35+a*.55;return `<svg viewBox="0 0 300 200">${hs.map((h,i)=>`<rect x="${20+i*38}" y="${175-h}" width="12" height="${h}" fill="${color}" opacity=".22" stroke="#111"/><rect x="${35+i*38}" y="${175-Math.min(h,t)}" width="12" height="${Math.min(h,t)}" fill="${color}" stroke="#111"/>`).join("")}<path d="M10 ${175-t}H290" stroke="#111" stroke-dasharray="4 6"/></svg>`}if(v==="eq")return `<svg viewBox="0 0 300 200"><path d="M15 165 C45 ${165-a} 70 ${165-a} 100 165 C125 ${165-b} 165 ${165-b} 195 165 C220 ${165-c} 255 ${165-c} 285 165 L285 180 L15 180Z" fill="${color}" opacity=".55" stroke="#111" stroke-width="2"/><text x="45" y="195">LOW</text><text x="140" y="195">MID</text><text x="235" y="195">HIGH</text></svg>`;if(v==="mod"){const dep=8+b*.18,rate=34-a*.22,p=o=>{let d=`M10 ${100+o}`;for(let x=10;x<290;x+=3)d+=` L${x} ${100+o+Math.sin(x/rate)*dep}`;return d};return `<svg viewBox="0 0 300 200"><path d="${p(-b*.12)}" fill="none" stroke="${color}" stroke-width="3"/><path d="${p(b*.12)}" fill="none" stroke="${color}" stroke-width="3" opacity=".4"/><circle cx="150" cy="100" r="${28+b*.2}" fill="none" stroke="#111" stroke-dasharray="3 6"/></svg>`}if(v==="delay"){const n=Math.max(2,Math.round(2+b/18)),sp=25+a*.5;return `<svg viewBox="0 0 300 200">${Array.from({length:n},(_,i)=>`<circle cx="${35+i*sp}" cy="100" r="${Math.max(5,24-i*3)}" fill="${color}" stroke="#111" opacity="${Math.max(.12,1-i*.14)}"/>`).join("")}</svg>`}if(v==="reverb"){const size=25+a*.4,n=3+Math.round(b/25);return `<svg viewBox="0 0 300 200"><circle cx="150" cy="100" r="15" fill="${color}" stroke="#111"/><rect x="${150-size}" y="${100-size*.65}" width="${size*2}" height="${size*1.3}" fill="none" stroke="#111" stroke-width="2"/>${Array.from({length:n},(_,i)=>`<circle cx="150" cy="100" r="${27+i*(size/n)}" fill="none" stroke="${color}" opacity="${1-i/(n+1)}"/>`).join("")}</svg>`}if(v==="pitch"){const sh=(a-50)*1.2;return `<svg viewBox="0 0 300 200"><path d="M20 130 C65 70 95 160 140 100 S220 40 280 100" fill="none" stroke="#111" stroke-width="3"/><path d="M20 ${130-sh} C65 ${70-sh} 95 ${160-sh} 140 ${100-sh} S220 ${40-sh} 280 ${100-sh}" fill="none" stroke="${color}" stroke-width="3"/></svg>`}if(v==="amp")return `<svg viewBox="0 0 300 200"><path d="M15 100c25-70 45 70 70 0s45 70 70 0" fill="none" stroke="#111" stroke-width="2"/><rect x="170" y="45" width="105" height="110" rx="8" fill="${color}" opacity=".2" stroke="#111"/><circle cx="222" cy="100" r="${28+a*.14}" fill="none" stroke="#111" stroke-width="3"/><circle cx="222" cy="100" r="${10+b*.07}" fill="${color}" stroke="#111"/></svg>`;return `<svg viewBox="0 0 300 200"><rect x="35" y="70" width="55" height="55" rx="8" fill="${color}" opacity=".4" stroke="#111"/><rect x="123" y="70" width="55" height="55" rx="8" fill="${color}" opacity=".65" stroke="#111"/><rect x="211" y="70" width="55" height="55" rx="8" fill="${color}" opacity=".85" stroke="#111"/><path d="M90 97h33M178 97h33" stroke="#111"/></svg>`}
function renderDetail(){const e=E[S.effect],f=F[e.f],cs=controls(e.v);detail.style.setProperty("--soft",f.c+"22");detail.innerHTML=`<div class="detail-top"><div class="detail-copy"><div class="eyebrow">${f.code}</div><h2>${displayName(S.effect)}</h2><p class="tagline">${L(e.t)}</p><div class="tags">${e.styles.map(x=>`<span class="tag">${x}</span>`).join("")}</div><p class="muted">${L(e.change)}</p></div><div class="lab"><div class="lab-head"><span>${copy[S.lang].lab}</span><span>${S.effect.toUpperCase()}</span></div><div class="lab-stage" id="labStage"></div><div class="controls">${cs.map((x,i)=>`<div class="control"><label>${x[0]}</label><input data-i="${i}" type="range" min="0" max="100" value="${x[1]}"><output>${x[1]}</output></div>`).join("")}</div></div></div><div class="detail-grid"><section class="detail-sec"><h3>${copy[S.lang].what}</h3><div class="listen">${e.hear[S.lang].map(x=>`<span>${x}</span>`).join("")}</div></section><section class="detail-sec"><h3>${copy[S.lang].styles}</h3><div class="tags">${e.styles.map(x=>`<span class="tag">${x}</span>`).join("")}</div></section><section class="detail-sec"><h3>${copy[S.lang].family}</h3><b>${L(f.n)} / ${f.code}</b><p class="muted">${L(f.d)}</p></section><section class="detail-sec"><h3>${copy[S.lang].changes}</h3><p>${L(e.change)}</p></section><section class="detail-sec"><h3>${copy[S.lang].controls}</h3><div class="rows">${e.controls.map(x=>`<div class="row"><b>${x[0]}</b><span>${L(x[1])}</span></div>`).join("")}</div></section><section class="detail-sec"><h3>${copy[S.lang].confuse}</h3><div class="compare">${e.compare.map(x=>`<article><b>${x[0]}</b><span class="muted">${L(x[1])}</span></article>`).join("")}</div></section><section class="detail-sec"><h3>${copy[S.lang].position}</h3><p>${L(e.position)}</p></section><section class="detail-sec"><h3>${copy[S.lang].experiment}</h3><p>${L(e.experiment)}</p></section></div>`;const vals=cs.map(x=>x[1]),update=()=>{document.getElementById("labStage").innerHTML=visual(e.v,vals[0],vals[1],vals[2],f.c)};detail.querySelectorAll("[data-i]").forEach(x=>x.oninput=()=>{vals[+x.dataset.i]=+x.value;x.nextElementSibling.value=x.value;update()});update()}
function renderChain(){const chainEl=document.getElementById("chain");chainEl.innerHTML="";chainData.forEach((x,i)=>{const b=document.createElement("button");if(x.f)b.style.setProperty("--color",F[x.f].c);b.innerHTML=`<small>${String(i+1).padStart(2,"0")}</small><h3>${L(x.title)}</h3><p>${L(x.body)}</p>`;b.onclick=()=>{S.chain=x.id;renderChain()};if(S.chain===x.id)b.style.outline="3px solid rgba(18,19,15,.12)";chainEl.appendChild(b)});const x=chainData.find(x=>x.id===S.chain)||chainData[0];chainTitle.textContent=L(x.title);chainBody.textContent=L(x.body);chainItems.innerHTML=x.items.map(y=>`<span class="keyword">${y}</span>`).join("")}
function renderGuide(){const issuesEl=document.getElementById("issues");issuesEl.innerHTML="";Object.entries(issueData).forEach(([k,x])=>{const b=document.createElement("button");b.className="issue "+(S.issue===k?"active":"");b.textContent=L(x.title);b.onclick=()=>{S.issue=k;renderGuide()};issuesEl.appendChild(b)});const x=issueData[S.issue];issueTitle.textContent=L(x.title);issueDesc.textContent=L(x.desc);steps.innerHTML=x.steps.map((s,i)=>`<article class="step"><div class="num">${String(i+1).padStart(2,"0")}</div><div><h3>${L(s[0])}</h3><p>${L(s[1])}</p></div></article>`).join("")}
apply();renderTool();renderLibrary();renderChain();renderGuide();
</script>
